[project]
name = "tech-challenge-recommender-system"
version = "0.1.0"
description = "Product recommendation system with PyTorch, DVC, MLflow and Docker"
authors = [
    {name = "renanpgonzalez",email = "renanpgonzalez@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas (>=2.2,<3)",
    "numpy (>=2.4.6,<3.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "torch (>=2.12.0,<3.0.0)",
    "mlflow (>=3.13.0,<4.0.0)",
    "dvc[s3] (>=3.67.1,<4.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=6.0.0,<7.0.0)",
    "ruff (>=0.15.17,<0.16.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.poetry]
packages = [
    { include = "recommender", from = "src" },
]

[tool.poetry.dependencies]
torch = { version = ">=2.12.0,<3.0.0", source = "pytorch_cpu" }

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
