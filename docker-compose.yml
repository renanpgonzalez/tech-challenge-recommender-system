services:
  mlflow:
    build:
      context: .
      target: runtime
    container_name: recommender-mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////workspace/mlflow.db
      --default-artifact-root /workspace/mlartifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - .:/workspace

  trainer:
    build:
      context: .
      target: runtime
    container_name: recommender-trainer
    command: dvc repro
    volumes:
      - .:/workspace
    depends_on:
      - mlflow
