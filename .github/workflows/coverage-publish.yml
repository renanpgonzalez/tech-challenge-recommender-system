name: CI/CD Pipeline - Test Coverage Pages

on:
  push:
    branches: [ "main" ]

# Concedendo permissão de escrita explicitamente
permissions:
  contents: write

jobs:
  build-and-deploy-coverage:
    name: Generate and Deploy Test Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install Dependencies
        run: |
          poetry install --with dev
          poetry run pip install coverage-badge

      - name: Run Tests and Generate HTML Report
        run: |
          poetry run pytest tests/ -v --cov=src --cov-report=html
          
      - name: Generate Coverage Badge
        run: |
          poetry run coverage-badge -o htmlcov/coverage.svg -f
          rm -f htmlcov/.gitignore

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./htmlcov
          commit_message: "docs(coverage): update test coverage report and badge"
