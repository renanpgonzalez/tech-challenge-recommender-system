name: CI/CD Pipeline - Docker Hub

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Pytest and Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install Dependencies
        run: |
          poetry install --with dev
          
      - name: Run Ruff Linting
        run: poetry run ruff check .

      - name: Run Tests
        run: poetry run pytest tests/ -v

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    # Esse job só roda no PUSH da branch main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Free Disk Space (Cleanup Runner)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker image prune --all --force

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/recommender-system:latest, ${{ secrets.DOCKERHUB_USERNAME }}/recommender-system:${{ github.sha }}
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/recommender-system:buildcache,mode=max

  run-pipeline:
    name: Run DVC Pipeline & Upload MLflow DB
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "sa-east-1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install --only main

      - name: Criar .env
        run: cp .env.example .env

      - name: Download Dataset do S3
        run: |
          mkdir -p data/raw/retailrocket
          aws s3 cp s3://fiappostech9mletgrupo17-fase02-mlflow-artifacts/data/events.csv \
            data/raw/retailrocket/events.csv \
            --region $AWS_REGION
          echo "Dataset baixado: $(wc -l < data/raw/retailrocket/events.csv) linhas"

      - name: Pull DVC Cache do S3
        run: poetry run dvc pull --run-cache || echo "Cache vazio ou inacessível — rodando pipeline do zero"

      - name: Executar Pipeline DVC
        run: poetry run dvc repro

      - name: Push DVC Cache para S3
        run: poetry run dvc push --run-cache

      - name: Upload MLflow DB para S3
        run: |
          aws s3 cp mlflow.db \
            s3://fiappostech9mletgrupo17-fase02-mlflow-artifacts/seed/mlflow.db \
            --region $AWS_REGION
          echo "✅ mlflow.db ($(du -sh mlflow.db | cut -f1)) enviado ao S3"

  deploy-to-aws:
    name: Continuous Deployment (SSM)
    needs: [build-and-push, run-pipeline]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "sa-east-1"
      DOCKER_IMAGE: "${{ secrets.DOCKERHUB_USERNAME }}/recommender-system:latest"
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Deploy via AWS SSM
        run: |
          echo "Buscando ID da instância EC2 do MLflow ligada..."
          INSTANCE_ID=$(aws ec2 describe-instances --region $AWS_REGION --filters "Name=tag:Name,Values=Recommender-MLflow-Server" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          
          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Nenhuma instância EC2 ligada encontrada. Pulando o deploy automático."
            exit 0
          fi

          echo "Instância encontrada: $INSTANCE_ID"
          echo "Construindo payload SSM com jq..."

          PARAMS=$(jq -n \
            --arg img "$DOCKER_IMAGE" \
            --arg user "$DOCKERHUB_USERNAME" \
            --arg pass "$DOCKERHUB_TOKEN" \
            --arg region "$AWS_REGION" \
            '{commands: [
              "echo === Espaço em disco antes do deploy === && df -h /",
              "docker login -u \($user) -p \($pass)",
              "docker stop mlflow-server || true",
              "docker rm mlflow-server || true",
              "docker system prune -a -f",
              "echo === Espaço em disco após limpeza === && df -h /",
              "mkdir -p /home/ec2-user/mlflow-data",
              "echo Baixando mlflow.db atualizado do S3... && aws s3 cp s3://fiappostech9mletgrupo17-fase02-mlflow-artifacts/seed/mlflow.db /home/ec2-user/mlflow-data/mlflow.db --region \($region) && echo Download concluido || echo Aviso: sem seed no S3 usando db existente",
              "docker pull \($img)",
              "docker run -d -p 5000:5000 --name mlflow-server --restart always -e AWS_DEFAULT_REGION=\($region) -e MLFLOW_BACKEND_STORE_URI=sqlite:////data/mlflow.db -e MLFLOW_ARTIFACT_ROOT=s3://fiappostech9mletgrupo17-fase02-mlflow-artifacts/ -e MLFLOW_CORS_ORIGINS=https://mlflow.recommender.cloud-ip.cc -v /home/ec2-user/mlflow-data:/data \($img)",
              "echo === Container iniciado === && docker ps --filter name=mlflow-server"
            ]}')

          echo "Enviando comando SSM para $INSTANCE_ID..."
          COMMAND_ID=$(aws ssm send-command \
            --region $AWS_REGION \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --comment "Atualizando container Docker do MLflow Server" \
            --query "Command.CommandId" --output text)

          echo "Comando enviado (ID: $COMMAND_ID). Aguardando execução no EC2..."

          for i in $(seq 1 20); do
            sleep 15
            STATUS=$(aws ssm get-command-invocation \
              --region $AWS_REGION \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/20] Status: $STATUS"
            if [ "$STATUS" == "Success" ]; then
              echo "✅ Container MLflow atualizado com sucesso!"
              exit 0
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "TimedOut" ]; then
              echo "❌ Falha na execução SSM. Logs:"
              aws ssm get-command-invocation \
                --region $AWS_REGION \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
          done
          echo "⚠️ Timeout. Verifique manualmente o comando $COMMAND_ID"
          exit 1
